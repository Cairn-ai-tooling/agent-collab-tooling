name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install uv (for the Python script tests)
        uses: astral-sh/setup-uv@v5
      - run: npm install
      - name: Lint markdown
        run: npm run lint
      - name: Run tests (node manifests + Python scripts)
        run: npm test
